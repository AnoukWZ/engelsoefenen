<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Engels oefenen</title>
<style>
:root{--ink:#20342e;--green:#3f695a;--green2:#2f5549;--rose:#e7d2cb;--paper:#f6efeb;--line:#c8d8d1;--sage:#dce8e3;--good:#739b8c;--bad:#a96f67;--muted:#637a71}*{box-sizing:border-box}body{margin:0;font-family:Aptos,"Segoe UI",system-ui,sans-serif;background:var(--rose);color:var(--ink);line-height:1.5}.app{max-width:780px;margin:auto;padding:28px 22px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}h1{font-size:30px;margin:0}h2{margin:0 0 14px}.panel{background:var(--paper);padding:26px;border-radius:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button{border:0;border-radius:10px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--green);color:#fff}.secondary{background:var(--sage);color:var(--ink)}.speak{background:#dce8e3;color:#2f5549}.danger{background:#f0deda;color:#8b514a}.hidden{display:none!important}.muted{color:var(--muted);font-size:15px}.list{padding:18px 2px;border-bottom:1px solid var(--line)}.list-title{font-size:19px;font-weight:800;margin-bottom:12px;cursor:pointer}.list-title:hover{text-decoration:underline}.overview-row{display:grid;grid-template-columns:1fr 1fr auto;gap:14px;padding:12px 4px;border-bottom:1px solid var(--line)}.progress{height:8px;background:#d8e2de;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:var(--green)}.question{text-align:center;font-size:30px;font-weight:800;margin:28px 0}.choice{width:100%;min-height:54px;background:#fff;border:1px solid var(--line);color:var(--ink);margin:6px 0}.correct{background:#dfeee6!important;border-color:var(--good)!important}.wrong{background:#f3dfdc!important;border-color:var(--bad)!important}.flash{width:100%;min-height:240px;background:#fff;border:1px solid var(--line);font-size:34px}.flash.back{background:var(--sage)}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin:8px 0}.hard{width:100%;background:#ead8d2;color:var(--ink);text-align:left;margin:10px 0}@media(max-width:560px){header{align-items:flex-start;flex-direction:column}.panel{padding:20px}.overview-row{grid-template-columns:1fr auto}.overview-row span:nth-child(2){grid-column:1/-1}.pair{grid-template-columns:1fr}.list .row button{flex:1}}
</style></head><body><div class="app">
<header><h1>Engels oefenen</h1><div class="row"><button class="secondary" id="homeBtn">🏠 Home</button><button class="secondary" id="manageBtn">⚙️ Lijsten</button></div></header>
<section id="home"><div class="panel"><h2>Wat wil je oefenen?</h2><div id="hardArea"></div><p class="muted">Klik op de naam van een lijst voor woorden en voortgang, of kies direct een oefenvorm.</p><div id="lists"></div></div></section>
<section id="detail" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><h2 id="detailTitle"></h2><button class="secondary" id="backBtn">← Terug naar lijsten</button></div><div class="row" style="margin:14px 0 18px"><button class="secondary" id="flashBtn">Flitskaarten</button><button class="primary" id="choiceBtn">Meerkeuze</button><button class="speak" id="speechBtn">Inspreken</button></div><p class="muted">🟢 beheerst &nbsp; 🟡 in ontwikkeling &nbsp; 🔴 extra oefenen &nbsp; ⚪ nog niet geoefend</p><div id="detailItems"></div></div></section>
<section id="quiz" class="hidden"><div class="panel"><div class="row" style="justify-content:space-between"><span id="counter"></span><span>⭐ <span id="score">0</span></span></div><div class="progress"><div id="bar" class="bar"></div></div><p id="mode" class="muted" style="text-align:center;font-weight:700"></p><p id="direction" class="muted" style="text-align:center"></p><div id="question" class="question"></div><div id="choices"></div><div id="flashArea" class="hidden"><button id="flashCard" class="flash"></button><p class="muted" style="text-align:center">Klik op het kaartje om het om te draaien.</p></div><div id="speechArea" class="hidden" style="text-align:center"><button id="micBtn" class="speak">🎙️ Spreek antwoord in</button><p id="heard"></p></div><p id="feedback" style="text-align:center;font-weight:700;min-height:24px"></p></div></section>
<section id="result" class="hidden"><div class="panel" style="text-align:center"><h2>Goed geoefend!</h2><p id="resultText"></p><div class="row" style="justify-content:center"><button class="primary" id="againBtn">Nog een keer</button><button class="secondary" id="resultHome">🏠 Naar home</button></div></div></section>
<section id="manage" class="hidden"><div class="panel"><h2>Nieuwe woordenlijst</h2><input id="newTitle" placeholder="Naam, bijvoorbeeld: Toets hoofdstuk 5"><div id="pairs"></div><div class="row"><button class="secondary" id="addPair">+ Regel toevoegen</button><button class="primary" id="saveList">Lijst opslaan</button></div><hr style="border:0;border-top:1px solid var(--line);margin:28px 0"><h2>Mijn lijsten</h2><div id="manageLists"></div></div></section>
</div><script>
const starter={title:"Voorbeeldlijst",items:[["dog","hond"],["cat","kat"],["house","huis"],["school","school"],["book","boek"],["friend","vriend"],["teacher","leraar"],["garden","tuin"],["I like swimming.","Ik hou van zwemmen."],["Where do you live?","Waar woon je?"],["This is my bedroom.","Dit is mijn slaapkamer."],["I am at home.","Ik ben thuis."],["My friend is at school.","Mijn vriend is op school."],["I have a new book.","Ik heb een nieuw boek."],["The garden is beautiful.","De tuin is mooi."],["My teacher is nice.","Mijn leraar is aardig."]]};
let lists=[starter],hard={},mastery={},active=0,items=[],queue=[],pos=0,score=0,current=null,good="",choices=[],practice="choice",attempts=0,recognition=null;
const $=id=>document.getElementById(id), key=i=>i[0]+"|||"+i[1], norm=s=>s.toLowerCase().replace(/[.,!?;:]/g,"").replace(/’/g,"'").trim().replace(/\s+/g," ");
function load(){try{let x=localStorage.getItem("englishLists2");if(x)lists=JSON.parse(x);if(!Array.isArray(lists))lists=[starter];if(!lists.some(x=>x.title==="Voorbeeldlijst"))lists.unshift(starter);hard=JSON.parse(localStorage.getItem("englishHard1")||"{}");mastery=JSON.parse(localStorage.getItem("englishMastery1")||"{}") }catch(e){lists=[starter];hard={};mastery={}}}
function save(){localStorage.setItem("englishLists2",JSON.stringify(lists));localStorage.setItem("englishHard1",JSON.stringify(hard));localStorage.setItem("englishMastery1",JSON.stringify(mastery))}
function show(id){["home","detail","quiz","result","manage"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="home")renderLists();if(id==="manage")renderManage()}
function state(i){let m=mastery[key(i)];if(!m)return"⚪";if((m.wrong||0)>=2)return"🔴";if((m.good||0)>=3)return"🟢";return"🟡"}
function renderLists(){$("lists").innerHTML="";lists.forEach((l,i)=>{let d=document.createElement("div");d.className="list";let t=document.createElement("div");t.className="list-title";t.textContent=l.title+" ("+l.items.length+" woorden/zinnen)";t.onclick=()=>openDetail(i);let r=document.createElement("div");r.className="row";[["Flitskaarten","secondary","flash"],["Meerkeuze","primary","choice"],["Inspreken","speak","speech"]].forEach(x=>{let b=document.createElement("button");b.textContent=x[0];b.className=x[1];b.onclick=()=>start(i,x[2]);r.appendChild(b)});d.append(t,r);$("lists").appendChild(d)});let hi=[];lists.forEach(l=>l.items.forEach(i=>{if(hard[key(i)]>0&&!hi.some(x=>key(x)===key(i)))hi.push(i)}));$("hardArea").innerHTML="";if(hi.length){let b=document.createElement("button");b.className="hard";b.textContent="🧠 Mijn moeilijke woorden en zinnen ("+hi.length+")";b.onclick=()=>{items=hi;practice="choice";begin()};$("hardArea").appendChild(b)}}
function openDetail(i){active=i;let l=lists[i];$("detailTitle").textContent=l.title;$("detailItems").innerHTML="";l.items.forEach(it=>{let r=document.createElement("div");r.className="overview-row";r.innerHTML="<strong></strong><span></span><span></span>";r.children[0].textContent=it[0];r.children[1].textContent=it[1];r.children[2].textContent=state(it);$("detailItems").appendChild(r)});show("detail")}
function start(i,m){active=i;items=lists[i].items;practice=m;begin()}
function begin(){score=0;pos=0;queue=[...items.keys()].sort(()=>Math.random()-.5);show("quiz");ask()}
function speak(t){if(!speechSynthesis)return;let u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function ask(){attempts=0;$("feedback").textContent="";$("heard").textContent="";current=items[queue[pos]];$("counter").textContent=(practice==="flash"?"Kaart ":"Vraag ")+(pos+1)+" van "+queue.length;$("score").textContent=score;$("bar").style.width=(pos/queue.length*100)+"%";$("mode").textContent=practice==="speech"?"Inspreken":practice==="flash"?"Flitskaarten":"Meerkeuze";$("choices").classList.add("hidden");$("flashArea").classList.add("hidden");$("speechArea").classList.add("hidden");if(practice==="flash")flashQ();else if(practice==="speech")speechQ();else choiceQ()}
function flashQ(){$("question").textContent="";$("direction").textContent="Bekijk het Engels. Klik voor de vertaling.";$("flashArea").classList.remove("hidden");$("flashCard").textContent=current[0];$("flashCard").classList.remove("back");$("flashCard").dataset.flip="0";speak(current[0])}
$("flashCard").onclick=()=>{if($("flashCard").dataset.flip==="1")return;$("flashCard").dataset.flip="1";$("flashCard").classList.add("back");$("flashCard").textContent=current[1];setTimeout(next,1200)};
function choiceQ(){let rev=Math.random()<.5;$("choices").classList.remove("hidden");let q=rev?current[1]:current[0];good=rev?current[0]:current[1];$("direction").textContent=rev?"Kies de juiste Engelse vertaling":"Kies de juiste Nederlandse vertaling";$("question").textContent=q;let pool=[];lists.forEach(l=>l.items.forEach(it=>{let a=rev?it[0]:it[1];if(a!==good&&!pool.includes(a))pool.push(a)}));choices=[good,...pool.sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);$("choices").innerHTML="";choices.forEach(c=>{let b=document.createElement("button");b.className="choice";b.textContent=c;if(rev){b.onmouseenter=()=>speak(c);b.onfocus=()=>speak(c)}b.onclick=()=>answer(b,c);$("choices").appendChild(b)});if(!rev)speak(q)}
function answer(b,c){attempts++;if(c===good){score++;b.classList.add("correct");document.querySelectorAll(".choice").forEach(x=>x.disabled=true);success();$("feedback").textContent="Goed gedaan!";setTimeout(next,700)}else{b.classList.add("wrong");b.disabled=true;failure();$("feedback").textContent="Bijna. Probeer het nog eens."}}
function success(){let k=key(current),m=mastery[k]||{good:0,wrong:0};m.good++;m.wrong=0;mastery[k]=m;hard[k]=Math.max(0,(hard[k]||0)-1);if(!hard[k])delete hard[k];save()}
function failure(){let k=key(current),m=mastery[k]||{good:0,wrong:0};m.wrong++;m.good=Math.max(0,m.good-1);mastery[k]=m;hard[k]=Math.min(5,(hard[k]||0)+1);save()}
function speechQ(){let rev=Math.random()<.5;$("speechArea").classList.remove("hidden");good=rev?current[1]:current[0];$("direction").textContent=rev?"Zeg de Nederlandse vertaling hardop":"Zeg de Engelse vertaling hardop";$("question").textContent=rev?current[0]:current[1];$("micBtn").dataset.lang=rev?"nl-NL":"en-GB";if(rev)speak(current[0]);let SR=window.SpeechRecognition||window.webkitSpeechRecognition;$("micBtn").disabled=!SR;if(!SR)$("feedback").textContent="Spraakherkenning is in deze browser niet beschikbaar."}
$("micBtn").onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;recognition=new SR();recognition.lang=$("micBtn").dataset.lang;recognition.maxAlternatives=3;$("micBtn").disabled=true;$("micBtn").textContent="🎧 Ik luister...";recognition.onresult=e=>{let r=e.results[e.results.length-1],alts=[...r].map(x=>x.transcript);$("heard").textContent='Ik hoorde: “'+alts[0]+'”';if(alts.some(x=>norm(x)===norm(good))){score++;$("score").textContent=score;success();$("feedback").textContent="Goed gedaan!";setTimeout(next,900)}else{$("feedback").textContent="Ik weet niet zeker of ik je goed verstond. Probeer nog eens.";resetMic()}};recognition.onerror=e=>{$("feedback").textContent=e.error==="not-allowed"?"Microfoontoegang is niet toegestaan.":"Spraakherkenning gaf een fout: "+e.error;resetMic()};recognition.onend=()=>resetMic();recognition.start()};
function resetMic(){$("micBtn").disabled=false;$("micBtn").textContent="🎙️ Spreek antwoord in"}
function next(){pos++;if(pos>=queue.length){$("bar").style.width="100%";$("resultText").textContent="Je hebt de oefenronde afgerond. Je voortgang is bijgewerkt.";show("result")}else ask()}
function addPair(){let d=document.createElement("div");d.className="pair";d.innerHTML='<input placeholder="Engels"><input placeholder="Nederlands"><button class="danger">Verwijder</button>';d.children[2].onclick=()=>d.remove();$("pairs").appendChild(d)}
function renderManage(){$("manageLists").innerHTML="";lists.forEach((l,i)=>{let d=document.createElement("div");d.className="row";d.style.margin="10px 0";let s=document.createElement("span");s.textContent=l.title+" ("+l.items.length+")";let b=document.createElement("button");b.className="danger";b.textContent="Verwijder";b.onclick=()=>{lists.splice(i,1);if(!lists.some(x=>x.title==="Voorbeeldlijst"))lists.unshift(starter);save();renderManage()};d.append(s,b);$("manageLists").appendChild(d)})}
$("saveList").onclick=()=>{let title=$("newTitle").value.trim(),a=[];[...$("pairs").children].forEach(r=>{let x=r.children[0].value.trim(),y=r.children[1].value.trim();if(x&&y)a.push([x,y])});if(!title||a.length<4){alert("Geef de lijst een naam en minimaal 4 complete regels.");return}lists.push({title,items:a});save();$("newTitle").value="";$("pairs").innerHTML="";for(let i=0;i<4;i++)addPair();renderManage()};
$("homeBtn").onclick=()=>show("home");$("manageBtn").onclick=()=>show("manage");$("backBtn").onclick=()=>show("home");$("flashBtn").onclick=()=>start(active,"flash");$("choiceBtn").onclick=()=>start(active,"choice");$("speechBtn").onclick=()=>start(active,"speech");$("againBtn").onclick=()=>start(active,practice);$("resultHome").onclick=()=>show("home");$("addPair").onclick=addPair;for(let i=0;i<4;i++)addPair();load();renderLists();save();
</script></body></html>
