<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engels oefenen</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;background:#e7d2cb;color:#20342e}main{background:#f6efeb;padding:28px;border-radius:16px}button{padding:12px 16px;border:0;border-radius:10px;background:#3f695a;color:white;font-weight:700;cursor:pointer}.alt{background:#dce8e3;color:#20342e}#heard{min-height:28px;margin:16px 0;font-size:18px}.small{color:#637a71}</style></head><body><main><h1>Engels oefenen</h1><p>Test hier eerst of de inspreekfunctie op jouw apparaat en browser goed werkt.</p><h2>Inspreken testen</h2><p class="small">Zeg na het klikken bijvoorbeeld: <strong>dog</strong></p><button id="mic">Inspreken</button> <button id="again" class="alt">Wis resultaat</button><div id="heard"></div><div id="status" class="small"></div></main><script>const mic=document.getElementById('mic'),heard=document.getElementById('heard'),status=document.getElementById('status');function reset(){mic.disabled=false;mic.textContent='Inspreken'}document.getElementById('again').onclick=()=>{heard.textContent='';status.textContent=''};mic.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Spraakherkenning is in deze browser niet beschikbaar.';return}const r=new SR();r.lang='en-GB';r.maxAlternatives=3;mic.disabled=true;mic.textContent='Ik luister…';status.textContent='Sta microfoontoegang toe als de browser daarom vraagt.';r.onresult=e=>{const x=e.results[e.results.length-1][0].transcript;heard.textContent='Ik hoorde: “'+x+'”';status.textContent=x.trim().toLowerCase()==='dog'?'Goed herkend!':'Probeer nog eens. Dit telt in deze test niet als fout.'};r.onerror=e=>{status.textContent='Spraakherkenning gaf een fout: '+e.error};r.onend=reset;try{r.start()}catch(e){status.textContent='Kon de microfoon niet starten.';reset()}};</script></body></html>
